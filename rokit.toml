# 툴 버전 고정 (Rokit). 설치: https://github.com/rojo-rbx/rokit
# 저장소 루트에서 `rokit install` 실행 → 아래 버전이 그대로 설치된다.
#
# [확인 필요] 아래 버전 문자열은 작업 시점에 온라인 검증을 하지 못했다.
# `rokit add rojo-rbx/rojo` 처럼 버전 없이 추가하면 최신 릴리스로 자동 고정되니,
# 설치가 실패하면 그 방식으로 다시 고정하고 이 파일을 커밋해 줘.
[tools]
rojo = "rojo-rbx/rojo@7.4.4"
wally = "UpliftGames/wally@0.3.2"
selene = "Kampfkarren/selene@0.27.1"
stylua = "JohnnyMorganz/StyLua@2.0.2"
lune = "lune-org/lune@0.8.9"
